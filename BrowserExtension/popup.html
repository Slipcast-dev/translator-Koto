<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <title>Koto · Slipcast-Dev</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header><img src="icon128.png" alt=""><div><h1>Koto</h1><small>Slipcast-Dev</small></div></header>
  <label><span data-i18n="source_label">From</span><select id="source"></select></label>
  <label><span data-i18n="target_label">To</span><select id="target"></select></label>
  <button id="selection" data-i18n="translate_selection">Translate selection</button>
  <button id="page" data-i18n="translate_page">Translate visible page</button>
  <div class="row">
    <button id="cancel" data-i18n="cancel">Cancel</button>
    <button id="clear" data-i18n="clear_translation">Remove translation</button>
  </div>
  <p id="status" role="status" data-i18n="bridge_required">Koto and an enabled browser bridge are required.</p>
  <pre id="result" tabindex="0" dir="auto"></pre>
  <p class="note" data-i18n="privacy_note">Text is sent to Koto. Choose the engine in the app. Browser text is not saved to history.</p>
  <script type="module" src="popup.js"></script>
</body>
</html>
