name: Repository checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  source-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 script/validate_repository.py
      - run: python3 script/validate_localization.py
      - run: python3 -m unittest discover -s Tests -p LocalizationCatalogTests.py
      - run: node --experimental-vm-modules --test Tests/BrowserLocalizationTests.mjs
      - run: node --check BrowserExtension/background.js && node --check BrowserExtension/popup.js && node --check BrowserExtension/i18n.js
      - run: python3 -m py_compile script/*.py
