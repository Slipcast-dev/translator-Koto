name: Repository checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  source-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
      - run: python3 script/validate_repository.py
      - run: python3 script/validate_localization.py
      - run: python3 -m unittest discover -s Tests -p LocalizationCatalogTests.py
      - run: node --experimental-vm-modules --test Tests/BrowserLocalizationTests.mjs
      - run: node --check BrowserExtension/background.js && node --check BrowserExtension/popup.js && node --check BrowserExtension/i18n.js
      - run: python3 -m py_compile script/*.py
  swift:
    # arm64/macOS 26 совпадает с минимальной платформой приложения и harness.
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: SwiftLint correctness rules
        run: |
          bash script/install_swiftlint.sh
          build/tooling/swiftlint/swiftlint lint --strict --config .swiftlint.yml
      # В чистом checkout нет ignored BrowserBridge binary и самого каталога.
      - name: Build native messaging host
        run: bash script/build_native_host.sh
      - name: Build Swift app without signing
        run: >-
          xcodebuild -project Koto.xcodeproj -scheme Koto -configuration Debug
          -destination 'platform=macOS,arch=arm64' -derivedDataPath build/ci-derived
          CODE_SIGNING_ALLOWED=NO build
      - name: Run deterministic Swift harnesses
        run: bash script/test_swift_ci.sh
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
