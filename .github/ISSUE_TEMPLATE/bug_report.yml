name: "Ошибка / Bug report"
description: "Сообщить об ошибке Koto · Report a reproducible Koto issue"
title: "[Bug]: "
body:
  - type: input
    id: version
    attributes:
      label: "Версия Koto / macOS / архитектура · Koto / macOS / architecture"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: "Шаги, ожидаемый и фактический результат · Steps, expected and actual behavior"
      description: "Укажите движок и вымышленный пример. Без ключей и личных текстов. · Include the engine and a synthetic example. Never include keys or private text."
    validations:
      required: true
