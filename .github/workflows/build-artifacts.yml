name: Attested preview artifacts
# Автоматический выпуск: изменение CURRENT_PROJECT_VERSION в Config/Product.xcconfig на main собирает
# приложение из исходников, подтверждает файлы attestation, создаёт тег и релиз.
# Тег v* или ручной запуск выполняют ту же сборку для уже выбранной версии.
# Прежние релизы workflow не удаляет: это решение остаётся за владельцем репозитория.
on:
  workflow_dispatch:
  push:
    tags: ['v*']
    branches: [main]
    paths: ['Config/Product.xcconfig']
permissions:
  contents: read
jobs:
  preview:
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          submodules: true
      - name: Resolve version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          marketing=$(sed -n 's/^MARKETING_VERSION = //p' Config/Product.xcconfig)
          build=$(sed -n 's/^CURRENT_PROJECT_VERSION = //p' Config/Product.xcconfig)
          tag="v${marketing}-alpha.${build}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "notes=Docs/RELEASE-${marketing}-alpha.${build}.md" >> "$GITHUB_OUTPUT"
          # Если релиз этой версии уже существует, повторная сборка не нужна.
          if gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        if: steps.version.outputs.skip != 'true'
        with:
          python-version: '3.12'
      - if: steps.version.outputs.skip != 'true'
        run: bash script/build_local_runtime.sh
      - if: steps.version.outputs.skip != 'true'
        run: bash script/build_native_host.sh
      - name: Build Release
        if: steps.version.outputs.skip != 'true'
        env:
          KOTO_CONFIGURATION: Release
        run: bash script/build_and_run.sh --build-only
      - if: steps.version.outputs.skip != 'true'
        run: python3 script/package_release.py --artifact-suffix ci
      - name: Package extension and checksums
        if: steps.version.outputs.skip != 'true'
        run: python3 script/package_browser.py
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        if: steps.version.outputs.skip != 'true'
        with:
          subject-path: 'dist/*'
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: steps.version.outputs.skip != 'true'
        with:
          name: koto-attested-preview
          path: dist/*
          if-no-files-found: error
      - name: Publish release
        if: steps.version.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          NOTES: ${{ steps.version.outputs.notes }}
        run: |
          base="https://github.com/${GITHUB_REPOSITORY}/blob/main/Docs"
          # Относительные ссылки заметок выпуска превращаются в абсолютные, заголовок убирается.
          sed -e '1{/^# /d;}' -e "s#(STATUS.md)#(${base}/STATUS.md)#" -e "s#(STATUS.en.md)#(${base}/STATUS.en.md)#" "${NOTES}" > release-notes.md
          marketing="${TAG#v}"
          gh release create "${TAG}" dist/* --repo "${GITHUB_REPOSITORY}" --target "${GITHUB_SHA}" --prerelease \
            --title "Koto ${marketing} · attested preview · Slipcast-Dev" --notes-file release-notes.md
