version: 2
updates:
  # Swift не использует SPM; стороннее C++-дерево закреплено отдельным source lock.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: gitsubmodule
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
