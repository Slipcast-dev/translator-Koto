name: CodeQL
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
  security-events: write
jobs:
  native:
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          languages: swift,c-cpp
          build-mode: manual
      - run: bash script/build_native_host.sh
      - run: >-
          xcodebuild -project Koto.xcodeproj -scheme Koto -configuration Release
          -destination 'platform=macOS,arch=arm64' -derivedDataPath build/codeql
          CODE_SIGNING_ALLOWED=NO clean build
      - run: xcrun clang++ -std=c++20 -Wall -Wextra -Wpedantic NativeTools/RuntimeLauncher.cpp -o build/codeql-launcher
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          category: native
  scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          languages: javascript-typescript,python
          build-mode: none
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          category: scripts
